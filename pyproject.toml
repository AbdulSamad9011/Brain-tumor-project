[project]
name = "brain-tumor-dx"
version = "0.1.0"
description = "Multi-stage pipeline for MRI/CT brain tumor classification, segmentation, and automated report generation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Abdul Samad" }
]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "monai>=1.3",
    "nibabel>=5.2",
    "pydicom>=2.4",
    "numpy>=1.26",
    "scikit-image>=0.22",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.32",
    "python-dotenv>=1.0",
    "grad-cam>=1.5",
    "langchain>=1.1",
    "langchain-groq>=1.0",
    "langchain-google-genai>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = ["mlflow>=2.11", "tensorboard>=2.16"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
